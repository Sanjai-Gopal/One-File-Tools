<!--
CSS Battle Arena
Single-file interactive CSS code-golf challenge & pixel accuracy game.
Built for One File Tools.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Battle Arena — One File Tools</title>
    <meta name="description" content="Replicate target visual designs using clean, minimal CSS. Test pixel accuracy, code brevity, and conquer 10 challenging CSS arenas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/feather-icons"></script>

    <script>
      (function () {
        const theme = localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <style>
      :root {
        --bg: #070913;
        --grid-line: #121629;
        --panel: rgba(14, 18, 36, 0.85);
        --panel-border: #1e2648;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-glow: rgba(99, 102, 241, 0.25);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --text-dim: #64748b;
        --canvas-bg: #1e1e2f;
        --success: #10b981;
        --warning: #f59e0b;
        --radius-sm: 8px;
        --radius-md: 16px;
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-display: "Space Grotesk", sans-serif;
      }

      [data-theme="light"] {
        --bg: #f8fafc;
        --grid-line: #e2e8f0;
        --panel: rgba(255, 255, 255, 0.95);
        --panel-border: #cbd5e1;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-glow: rgba(79, 70, 229, 0.15);
        --text: #0f172a;
        --text-muted: #475569;
        --text-dim: #94a3b8;
        --canvas-bg: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg);
        background-image: 
          radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.05), transparent 30%),
          radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.05), transparent 30%),
          linear-gradient(var(--grid-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
        color: var(--text);
        padding: 24px 16px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .app {
        width: 100%;
        max-width: 1100px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .title-group h1 {
        font-family: var(--font-display);
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .title-group p {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .header-controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .btn {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        color: var(--text);
        padding: 8px 16px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-display);
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        box-shadow: 0 4px 14px var(--accent-glow);
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      /* Arena Workspace */
      .arena-layout {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }

      @media (max-width: 900px) {
        .arena-layout {
          grid-template-columns: 1fr;
        }
      }

      /* Viewports Box */
      .viewports-panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .preview-tabs {
        display: flex;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        padding: 3px;
        gap: 4px;
      }

      .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-muted);
        padding: 6px 10px;
        border-radius: 6px;
        font-family: var(--font-display);
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .tab-btn.active {
        background: var(--accent);
        color: #fff;
      }

      .viewport-box {
        position: relative;
        width: 100%;
        height: 300px;
        background: var(--canvas-bg);
        border: 2px solid var(--panel-border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.4);
      }

      .render-canvas {
        width: 400px;
        height: 300px;
        display: block;
      }

      .diff-slider-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
      }

      .diff-slider-container label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
      }

      .diff-slider {
        flex: 1;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Score Strip */
      .score-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .score-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        text-align: center;
      }

      .score-card .title {
        font-size: 0.7rem;
        color: var(--text-dim);
        text-transform: uppercase;
        font-weight: 600;
      }

      .score-card .val {
        font-family: var(--font-mono);
        font-size: 1.15rem;
        font-weight: 700;
        margin-top: 2px;
      }

      /* Code Editor Area */
      .editor-panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        backdrop-filter: blur(12px);
      }

      .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--panel-border);
        background: rgba(0, 0, 0, 0.15);
      }

      .editor-title {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .editor-textarea {
        flex: 1;
        min-height: 280px;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 0.9rem;
        line-height: 1.5;
        padding: 18px;
        resize: vertical;
        tab-size: 2;
      }

      .editor-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        border-top: 1px solid var(--panel-border);
        background: rgba(0, 0, 0, 0.15);
      }

      .char-count {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-dim);
      }

      .char-count span {
        color: var(--accent);
        font-weight: 600;
      }

      /* Level Selector Grid */
      .levels-container {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-md);
        padding: 20px;
        margin-bottom: 24px;
        backdrop-filter: blur(12px);
      }

      .levels-title {
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .levels-grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
      }

      @media (max-width: 768px) {
        .levels-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .level-btn {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        padding: 10px 4px;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        transition: all 0.15s ease;
      }

      .level-btn:hover {
        border-color: var(--accent);
        color: var(--text);
      }

      .level-btn.active {
        border-color: var(--accent);
        background: var(--accent-glow);
        color: var(--accent);
        font-weight: 700;
      }

      .level-stars {
        font-size: 0.65rem;
        color: var(--warning);
      }

      footer {
        text-align: center;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      footer a {
        color: var(--text-muted);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="title-group">
          <h1>CSS Battle Arena</h1>
          <p>Pixel-perfect CSS challenges • Replicate target designs with minimal, elegant CSS</p>
        </div>
        <div class="header-controls">
          <button class="btn" id="themeToggle" title="Toggle Theme">
            <i data-feather="moon"></i>
          </button>
          <button class="btn btn-primary" id="btnSubmit">
            <i data-feather="check-circle"></i> Test Accuracy
          </button>
        </div>
      </header>

      <!-- Level Selection Strip -->
      <section class="levels-container">
        <div class="levels-title">
          <i data-feather="award" style="width: 16px; height: 16px; color: var(--warning);"></i>
          <span>Battlegrounds (10 Arenas)</span>
        </div>
        <div class="levels-grid" id="levelsGrid"></div>
      </section>

      <!-- Arena Viewports & Code Editor -->
      <main class="arena-layout">
        <!-- Viewports Column -->
        <div class="viewports-panel">
          <div class="preview-tabs">
            <button class="tab-btn active" id="tabSplit">Side by Side</button>
            <button class="tab-btn" id="tabDiff">Diff Overlay</button>
            <button class="tab-btn" id="tabTarget">Target Only</button>
          </div>

          <div class="viewport-box">
            <!-- Hidden Canvas for Target -->
            <canvas id="targetCanvas" class="render-canvas" width="400" height="300" style="display: none;"></canvas>
            <!-- Hidden Canvas for User -->
            <canvas id="userCanvas" class="render-canvas" width="400" height="300" style="display: none;"></canvas>
            <!-- Display Canvas -->
            <canvas id="displayCanvas" class="render-canvas" width="400" height="300"></canvas>
          </div>

          <div class="diff-slider-container">
            <label>Diff Blend: <span id="blendVal" style="color: var(--accent);">50%</span></label>
            <input type="range" class="diff-slider" id="diffSlider" min="0" max="100" value="50" />
          </div>

          <div class="score-strip">
            <div class="score-card">
              <div class="title">Visual Match</div>
              <div class="val" id="scoreAccuracy" style="color: var(--accent);">0.0%</div>
            </div>
            <div class="score-card">
              <div class="title">Code Length</div>
              <div class="val" id="scoreChars">0 chars</div>
            </div>
            <div class="score-card">
              <div class="title">Rating</div>
              <div class="val" id="scoreStars" style="color: var(--warning);">—</div>
            </div>
          </div>
        </div>

        <!-- Editor Column -->
        <div class="editor-panel">
          <div class="editor-header">
            <div class="editor-title">
              <i data-feather="code" style="width: 14px; height: 14px;"></i>
              <span id="levelName">#1 Simply Square</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-dim);">HTML: &lt;div class="box"&gt;&lt;/div&gt;</div>
          </div>

          <textarea id="cssEditor" class="editor-textarea" spellcheck="false"></textarea>

          <div class="editor-footer">
            <div class="char-count">
              Brevity: <span id="charCount">0</span> characters
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn" id="btnReset" style="padding: 6px 12px; font-size: 0.75rem;">Reset</button>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <p>Part of <a href="https://github.com/praveenscience/One-File-Tools" target="_blank" rel="noopener noreferrer">One File Tools</a> • Open Source with purpose.</p>
      </footer>
    </div>

    <!-- Hidden iframe for rendering user code cleanly -->
    <iframe id="sandboxFrame" style="display: none;"></iframe>

    <script>
      feather.replace();

      // Theme toggle
      document.getElementById("themeToggle").onclick = () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      };

      // Levels Definition (Target Draw Functions)
      const levels = [
        {
          id: 1,
          name: "Simply Square",
          starter: `body {\n  background: #191919;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 140px;\n  height: 140px;\n  background: #e04462;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#191919";
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = "#e04462";
            ctx.fillRect(130, 80, 140, 140);
          }
        },
        {
          id: 2,
          name: "Pill Center",
          starter: `body {\n  background: #0b2429;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 200px;\n  height: 90px;\n  background: #f3ac3c;\n  border-radius: 50px;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#0b2429";
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = "#f3ac3c";
            ctx.beginPath();
            ctx.roundRect(100, 105, 200, 90, 45);
            ctx.fill();
          }
        },
        {
          id: 3,
          name: "Overlapping Rings",
          starter: `body {\n  background: #293462;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 120px;\n  height: 120px;\n  border-radius: 50%;\n  background: #fff1c5;\n  box-shadow: 60px 0 0 #fe5f55;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#293462";
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = "#fe5f55";
            ctx.beginPath();
            ctx.arc(230, 150, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff1c5";
            ctx.beginPath();
            ctx.arc(170, 150, 60, 0, Math.PI * 2);
            ctx.fill();
          }
        },
        {
          id: 4,
          name: "Sunset Horizon",
          starter: `body {\n  background: linear-gradient(#e35157 50%, #19121e 50%);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 120px;\n  height: 60px;\n  background: #f7da64;\n  border-radius: 60px 60px 0 0;\n  margin-bottom: 60px;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#e35157";
            ctx.fillRect(0, 0, 400, 150);
            ctx.fillStyle = "#19121e";
            ctx.fillRect(0, 150, 400, 150);
            ctx.fillStyle = "#f7da64";
            ctx.beginPath();
            ctx.arc(200, 150, 60, Math.PI, 0);
            ctx.fill();
          }
        },
        {
          id: 5,
          name: "Diamond Crest",
          starter: `body {\n  background: #4f772d;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 120px;\n  height: 120px;\n  background: #fefae0;\n  transform: rotate(45deg);\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#4f772d";
            ctx.fillRect(0, 0, 400, 300);
            ctx.save();
            ctx.translate(200, 150);
            ctx.rotate((45 * Math.PI) / 180);
            ctx.fillStyle = "#fefae0";
            ctx.fillRect(-60, -60, 120, 120);
            ctx.restore();
          }
        },
        {
          id: 6,
          name: "Target Radar",
          starter: `body {\n  background: #141b2d;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 160px;\n  height: 160px;\n  border-radius: 50%;\n  border: 15px solid #28a745;\n  outline: 15px solid #17a2b8;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#141b2d";
            ctx.fillRect(0, 0, 400, 300);
            ctx.lineWidth = 15;
            ctx.strokeStyle = "#17a2b8";
            ctx.beginPath();
            ctx.arc(200, 150, 95, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = "#28a745";
            ctx.beginPath();
            ctx.arc(200, 150, 70, 0, Math.PI * 2);
            ctx.stroke();
          }
        },
        {
          id: 7,
          name: "Eclipse Halo",
          starter: `body {\n  background: #000;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 120px;\n  height: 120px;\n  border-radius: 50%;\n  background: #000;\n  box-shadow: 0 0 35px #38bdf8;\n  border: 3px solid #38bdf8;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, 400, 300);
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 35;
            ctx.fillStyle = "#000";
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(200, 150, 60, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
        },
        {
          id: 8,
          name: "Cross Stitch",
          starter: `body {\n  background: #654062;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 40px;\n  height: 140px;\n  background: #f3c623;\n  box-shadow: 0 0 0 0 #f3c623;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#654062";
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = "#f3c623";
            ctx.fillRect(180, 80, 40, 140);
            ctx.fillRect(130, 130, 140, 40);
          }
        },
        {
          id: 9,
          name: "Concentric Cubes",
          starter: `body {\n  background: #1a1c23;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 160px;\n  height: 160px;\n  background: #ff5722;\n  outline: 20px solid #ff9800;\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#1a1c23";
            ctx.fillRect(0, 0, 400, 300);
            ctx.fillStyle = "#ff9800";
            ctx.fillRect(100, 50, 200, 200);
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(120, 70, 160, 160);
          }
        },
        {
          id: 10,
          name: "Cosmic Portal",
          starter: `body {\n  background: #0f172a;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  height: 100vh;\n  margin: 0;\n}\n.box {\n  width: 130px;\n  height: 130px;\n  border-radius: 50%;\n  background: radial-gradient(circle, #818cf8 30%, #4338ca 70%);\n}`,
          draw: (ctx) => {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, 400, 300);
            const grad = ctx.createRadialGradient(200, 150, 10, 200, 150, 65);
            grad.addColorStop(0, "#818cf8");
            grad.addColorStop(1, "#4338ca");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(200, 150, 65, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      ];

      let currentLevelIdx = 0;
      let activeTab = "split"; // 'split', 'diff', 'target'

      const targetCanvas = document.getElementById("targetCanvas");
      const userCanvas = document.getElementById("userCanvas");
      const displayCanvas = document.getElementById("displayCanvas");
      const tCtx = targetCanvas.getContext("2d");
      const uCtx = userCanvas.getContext("2d");
      const dCtx = displayCanvas.getContext("2d");

      const cssEditor = document.getElementById("cssEditor");
      const charCount = document.getElementById("charCount");
      const scoreAccuracy = document.getElementById("scoreAccuracy");
      const scoreChars = document.getElementById("scoreChars");
      const scoreStars = document.getElementById("scoreStars");
      const blendVal = document.getElementById("blendVal");
      const diffSlider = document.getElementById("diffSlider");

      // Build Level Buttons
      const grid = document.getElementById("levelsGrid");
      levels.forEach((lvl, idx) => {
        const btn = document.createElement("button");
        btn.className = `level-btn ${idx === 0 ? "active" : ""}`;
        btn.innerHTML = `<span>#${lvl.id}</span><span class="level-stars">★★★</span>`;
        btn.onclick = () => selectLevel(idx);
        grid.appendChild(btn);
      });

      function selectLevel(idx) {
        currentLevelIdx = idx;
        const lvl = levels[idx];
        document.querySelectorAll(".level-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
        document.getElementById("levelName").textContent = `#${lvl.id} ${lvl.name}`;
        cssEditor.value = lvl.starter;
        charCount.textContent = lvl.starter.length;

        // Draw target
        lvl.draw(tCtx);
        renderUserCode();
      }

      function renderUserCode() {
        const code = cssEditor.value;
        charCount.textContent = code.length;

        // Draw to SVG image -> Canvas for pixel precision
        const html = `
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
            <foreignObject width="100%" height="100%">
              <div xmlns="http://www.w3.org/1999/xhtml">
                <style>${code}</style>
                <div class="box"></div>
              </div>
            </foreignObject>
          </svg>`;

        const img = new Image();
        img.onload = () => {
          uCtx.clearRect(0, 0, 400, 300);
          uCtx.drawImage(img, 0, 0);
          updateDisplay();
        };
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(html);
      }

      function updateDisplay() {
        dCtx.clearRect(0, 0, 400, 300);

        if (activeTab === "target") {
          dCtx.drawImage(targetCanvas, 0, 0);
        } else if (activeTab === "split") {
          // Half user, half target with slider split or side-by-side
          const split = (diffSlider.value / 100) * 400;
          dCtx.drawImage(targetCanvas, 0, 0, split, 300, 0, 0, split, 300);
          dCtx.drawImage(userCanvas, split, 0, 400 - split, 300, split, 0, 400 - split, 300);

          // Divider line
          dCtx.strokeStyle = "#6366f1";
          dCtx.lineWidth = 2;
          dCtx.beginPath();
          dCtx.moveTo(split, 0);
          dCtx.lineTo(split, 300);
          dCtx.stroke();
        } else if (activeTab === "diff") {
          // Difference blending
          dCtx.drawImage(targetCanvas, 0, 0);
          dCtx.globalCompositeOperation = "difference";
          dCtx.drawImage(userCanvas, 0, 0);
          dCtx.globalCompositeOperation = "source-over";
        }
      }

      function calculateAccuracy() {
        const tData = tCtx.getImageData(0, 0, 400, 300).data;
        const uData = uCtx.getImageData(0, 0, 400, 300).data;

        let totalDiff = 0;
        const totalPixels = 400 * 300;

        for (let i = 0; i < tData.length; i += 4) {
          const dr = Math.abs(tData[i] - uData[i]);
          const dg = Math.abs(tData[i + 1] - uData[i + 1]);
          const db = Math.abs(tData[i + 2] - uData[i + 2]);
          totalDiff += (dr + dg + db) / (255 * 3);
        }

        const accuracy = Math.max(0, Math.min(100, 100 - (totalDiff / totalPixels) * 100));
        scoreAccuracy.textContent = `${accuracy.toFixed(1)}%`;
        scoreChars.textContent = `${cssEditor.value.length} chars`;

        let stars = "★☆☆";
        if (accuracy > 99) stars = "★★★";
        else if (accuracy > 85) stars = "★★☆";
        scoreStars.textContent = stars;

        if (accuracy > 95) scoreAccuracy.style.color = "var(--success)";
        else scoreAccuracy.style.color = "var(--accent)";
      }

      // Event Listeners
      cssEditor.addEventListener("input", renderUserCode);

      diffSlider.addEventListener("input", (e) => {
        blendVal.textContent = `${e.target.value}%`;
        updateDisplay();
      });

      document.getElementById("btnSubmit").onclick = () => {
        renderUserCode();
        setTimeout(calculateAccuracy, 150);
      };

      document.getElementById("btnReset").onclick = () => {
        cssEditor.value = levels[currentLevelIdx].starter;
        renderUserCode();
      };

      document.getElementById("tabSplit").onclick = (e) => {
        setActiveTab("split", e.target);
      };
      document.getElementById("tabDiff").onclick = (e) => {
        setActiveTab("diff", e.target);
      };
      document.getElementById("tabTarget").onclick = (e) => {
        setActiveTab("target", e.target);
      };

      function setActiveTab(tab, btn) {
        activeTab = tab;
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        updateDisplay();
      }

      // Initialize Level 1
      selectLevel(0);
      setTimeout(calculateAccuracy, 300);
    </script>
  </body>
</html>
